<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频提取器 - 从视频中提取音频</title>
    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="material-symbols-rounded">music_note</span>
                <h1>音频提取器</h1>
            </div>
            <p class="tagline">轻松从视频中提取高质量音频</p>
        </header>
        
        <main>
            <div class="upload-container">
                <div id="drop-area" class="drop-area">
                    <div class="upload-icon">
                        <span class="material-symbols-rounded">cloud_upload</span>
                    </div>
                    <h2>拖放视频文件到这里</h2>
                    <p>或者</p>
                    <label for="file-input" class="upload-btn">选择文件</label>
                    <input type="file" id="file-input" accept="video/*" hidden>
                    <p class="file-info">支持的格式：MP4, AVI, MOV, MKV, WMV 等</p>
                </div>
                
                <div id="progress-container" class="progress-container hidden">
                    <div class="progress-info">
                        <span id="file-name">processing.mp4</span>
                        <span id="progress-percent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                </div>
            </div>
            
            <div id="result-container" class="result-container hidden">
                <div class="result-header">
                    <h2>提取完成！</h2>
                    <p>您的音频已准备就绪</p>
                </div>
                
                <div class="audio-player">
                    <div class="audio-controls">
                        <button id="play-btn" class="control-btn">
                            <span class="material-symbols-rounded">play_arrow</span>
                        </button>
                        <div class="timeline">
                            <div id="current-time">00:00</div>
                            <div class="progress-slider">
                                <input type="range" id="seek-slider" min="0" max="100" value="0">
                                <div id="audio-progress"></div>
                            </div>
                            <div id="duration">00:00</div>
                        </div>
                        <button id="volume-btn" class="control-btn">
                            <span class="material-symbols-rounded">volume_up</span>
                        </button>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <a id="download-link" class="download-btn" download="extracted-audio.mp3">
                        <span class="material-symbols-rounded">download</span>
                        下载 MP3
                    </a>
                    <button id="new-conversion-btn" class="new-btn">
                        <span class="material-symbols-rounded">add</span>
                        新的转换
                    </button>
                </div>
            </div>
        </main>
        
        <footer>
            <div class="features">
                <div class="feature">
                    <span class="material-symbols-rounded">high_quality</span>
                    <h3>高质量提取</h3>
                    <p>保留原始音频品质</p>
                </div>
                <div class="feature">
                    <span class="material-symbols-rounded">lock</span>
                    <h3>隐私保护</h3>
                    <p>文件不上传到服务器</p>
                </div>
                <div class="feature">
                    <span class="material-symbols-rounded">bolt</span>
                    <h3>快速处理</h3>
                    <p>本地处理，无需等待</p>
                </div>
            </div>
            <div class="copyright">
                <p>© 2025 音频提取器 | 保护您的隐私，文件仅在本地设备上处理</p>
            </div>
        </footer>
    </div>
    
    <script src="src/js/app.js"></script>
</body>
</html>
